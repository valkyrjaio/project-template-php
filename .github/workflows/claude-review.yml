name: Claude Review

on:
  pull_request:
    branches: [ 'master', '*.x' ]
    types: [ opened, ready_for_review, synchronize ]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    name: Claude Review
    uses: valkyrjaio/.github/.github/workflows/_claude-review.yml@64b1dfee2c9b96f7fff23a76aba1c6e6fe4d0a67
    permissions:
      contents: read
      pull-requests: write
    secrets: inherit
